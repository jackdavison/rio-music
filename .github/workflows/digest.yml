name: digest

on:
  schedule:
    - cron: "0 11 * * *"            # 08:00 America/Sao_Paulo (UTC-3, no DST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the digest in the log instead of sending"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: python -m musicfinder digest ${{ inputs.dry_run && '--dry-run' || '' }}
