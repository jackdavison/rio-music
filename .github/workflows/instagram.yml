name: instagram

on:
  schedule:
    - cron: "40 11,22 * * *"        # 08:40 and 19:40 America/Sao_Paulo (twice daily max)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print alerts instead of sending"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data           # one writer of data/events.db at a time
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest db, not the commit this run was queued at (runs wait on each other)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MUSICFINDER_MODEL: ${{ vars.MUSICFINDER_MODEL || 'claude-opus-5-5' }}
          MUSICFINDER_MODEL_EXTRACT: ${{ vars.MUSICFINDER_MODEL_EXTRACT }}
          MUSICFINDER_MODEL_VISION: ${{ vars.MUSICFINDER_MODEL_VISION }}
          MUSICFINDER_MODEL_RANK: ${{ vars.MUSICFINDER_MODEL_RANK }}
          MUSICFINDER_MODEL_DEDUPE: ${{ vars.MUSICFINDER_MODEL_DEDUPE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_INSTAGRAM: "1"
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ENABLE_GCAL: ${{ vars.ENABLE_GCAL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GCAL_ID_RIO: ${{ secrets.GCAL_ID_RIO }}
          GCAL_ID_SP: ${{ secrets.GCAL_ID_SP }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: |
          ARGS=""
          ARGS="--only instagram"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m musicfinder collect $ARGS
          python -m musicfinder status
      - name: Commit database
        run: |
          git config user.name "musicfinder-bot"
          git config user.email "musicfinder-bot@users.noreply.github.com"
          git add data/events.db site/index.html   # index.html: cache-busting hashes from web.bust_cache
          git diff --cached --quiet || git commit -m "data: instagram $(date -u +%FT%TZ)"
          git pull --rebase -X theirs && git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
