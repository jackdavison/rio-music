<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Música ao vivo</title>
<meta name="theme-color" content="#1d1a16">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="brand">Música ao vivo</div>
  <div class="seg" id="cityToggle" role="tablist" aria-label="Cidade"></div>
</header>

<main>
  <section id="tonight" class="tonight" aria-label="Hoje à noite">
    <h2>Hoje à noite</h2>
    <div class="tonight-list" id="tonightList"></div>
  </section>

  <div class="toolbar">
    <div class="seg" id="viewToggle" role="tablist" aria-label="Visualização">
      <button data-view="list" class="on">Lista</button>
      <button data-view="week">Semana</button>
      <button data-view="month">Mês</button>
    </div>
    <button id="filtersBtn" class="ghost" aria-expanded="false">Filtros <span id="filterCount"></span></button>
  </div>

  <form id="filters" class="filters" hidden>
    <label class="row">Nota mínima <output id="minScoreOut">50</output>
      <input type="range" id="minScore" min="0" max="100" step="5" value="50"></label>
    <label class="check"><input type="checkbox" id="freeOnly"> Só grátis</label>
    <label class="check"><input type="checkbox" id="newOnly"> Só novos</label>
    <label class="row">Bairro <select id="hood"><option value="">Todos</option></select></label>
    <div class="row dates">
      <label>De <input type="date" id="dateFrom"></label>
      <label>Até <input type="date" id="dateTo"></label>
    </div>
    <div class="row"><span>Gêneros</span><div class="chips" id="genres"></div></div>
    <button type="button" id="resetFilters" class="ghost small">Limpar filtros</button>
  </form>

  <div id="listView" class="list"></div>
  <div id="calView" hidden></div>
  <p class="meta" id="meta"></p>
  <p class="meta feeds" id="feeds"></p>
</main>

<dialog id="detail">
  <article>
    <button class="close" aria-label="Fechar" id="closeDetail">×</button>
    <div id="detailBody"></div>
  </article>
</dialog>
</body>
</html>
