# Weekly / monthly rodas in São Paulo, expanded into dated events for the next 8 weeks.
# Fields: name, venue, neighborhood, weekday (monday..sunday or segunda..domingo, or a list),
#   time "HH:MM", end_time, every: weekly|biweekly|monthly, week_of_month: [1..5 or -1 = last],
#   anchor (biweekly: any date it happens on), free, price, artists, link, notes, genre,
#   kind (roda = open, musicians sit in; the default | show = staged performance),
#   active_from, active_until (YYYY-MM-DD).
# Entries with `placeholder: true` are ignored. Fill these in and delete the flag.
events:
  - name: "PLACEHOLDER — Roda de samba (weekly)"
    placeholder: true
    venue: "PLACEHOLDER venue"
    neighborhood: "PLACEHOLDER bairro"
    weekday: monday
    time: "19:00"
    end_time: "23:00"
    every: weekly
    free: true
    notes: "Replace with a real weekly roda; check the venue's Instagram for cancellations."
    genre: samba

  - name: "PLACEHOLDER — Roda de choro (1st and 3rd Saturday)"
    placeholder: true
    venue: "PLACEHOLDER venue"
    neighborhood: "PLACEHOLDER bairro"
    weekday: saturday
    time: "14:00"
    every: monthly
    week_of_month: [1, 3]
    price: 20
    genre: choro
    active_from: 2026-01-01
    active_until: 2026-12-31
