# Weekly / monthly rodas in Rio, expanded into dated events for the next 8 weeks.
# Fields: name, venue, neighborhood, weekday (monday..sunday or segunda..domingo, or a list),
#   time "HH:MM", end_time, every: weekly|monthly, week_of_month: [1..5 or -1 = last],
#   free, price, artists, link, notes, genre, active_from, active_until (YYYY-MM-DD).
# Entries with `placeholder: true` are ignored.
events:
  - name: Samba do Trabalhador
    artists: [Moacyr Luz]
    venue: Renascença Clube
    neighborhood: Andaraí
    weekday: monday
    time: "16:30"
    genre: samba
    notes: Roda led by Moacyr Luz.

